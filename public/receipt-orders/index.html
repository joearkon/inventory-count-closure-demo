<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收货管理 · 小笼包门店运营</title><link rel="stylesheet" href="/procurement.css"><script src="/loading.js"></script><script src="/app-shell.js"></script></head><body data-procurement-mode="receipt"><main class="wrap"><div class="crumb"><a href="/">运营中心</a> / 日常运营 / 收货管理</div><header class="head"><div><h1>收货管理</h1><p>可从待收货订货单生成草稿，也可独立收货；人工确认后才生成库存流水。</p></div></header><nav class="tabs"><button class="tab active" data-tab="list">收货单列表</button><button class="tab" data-tab="create">新建收货草稿</button></nav><section class="panel" data-panel="list"><div class="filters"><label>门店<select id="store-filter"><option value="">全部门店</option></select></label><label>状态<select id="status-filter"><option value="">全部状态</option><option value="draft">草稿</option><option value="received">已确认入库</option><option value="cancelled">已取消</option></select></label></div><div class="table-wrap"><table><thead><tr><th>收货单号</th><th>关联订货单</th><th>日期</th><th>门店</th><th>供应商</th><th>物料</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="list-pager"></div></section><section class="panel" data-panel="create" hidden><div class="panel-head"><h2>新建收货草稿</h2><span>确认前不写库存</span></div><form id="create-form"><div class="form-grid"><label class="wide">关联订货单<select id="purchase-order"><option value="">独立收货（不关联订货单）</option></select></label><label>门店<select id="store" required></select></label><label>收货日期<input id="date" type="date" required></label><label>供应商<input id="supplier" placeholder="未关联供应商"></label><label>紧急程度<select id="urgency"><option value="normal">普通</option><option value="urgent">紧急</option><option value="critical">最高</option></select></label><label>来源类型<select id="source-type"><option value="manual">人工新建</option><option value="work_order">跟进工单</option><option value="restock_request">补货申请</option><option value="ai_suggestion">AI 建议</option></select></label><label class="wide">来源工单<input id="work-order" placeholder="可选，例如 OPT-..."></label><label class="wide">备注<textarea id="note" rows="2"></textarea></label></div><div class="lines"><b>实收物料明细</b><div id="line-rows"></div><button type="button" class="btn secondary" id="add-line">+ 增加物料</button></div><div class="warning">保存后仍是草稿；必须进入详情页人工确认，系统才会生成收货库存流水。</div><div class="actions"><button class="btn" type="submit">保存收货草稿</button></div></form><div id="toast" class="toast"></div></section></main><script src="/procurement-page.js"></script></body></html>
