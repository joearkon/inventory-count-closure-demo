<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人推送配置 · 小笼包门店运营</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1060px;margin:auto;padding:26px 22px 48px}.crumb{font-size:13px;color:#8f959e}.crumb a{color:#3370ff;text-decoration:none}.head{margin:8px 0 18px}.head h1{margin:0;font-size:24px}.head p{margin:5px 0 0;color:#646a73}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}.panel h2{margin:0;padding:15px 17px;border-bottom:1px solid #f0f1f3;font-size:16px}.body{padding:16px 17px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #f4f5f7}.row:last-child{border:0}.row small{display:block;color:#8f959e;margin-top:2px}.field{display:block;margin:10px 0;color:#646a73;font-size:12px}.field input{display:block;width:100%;margin-top:5px;border:1px solid #dcdfe5;border-radius:6px;padding:8px 9px;font:14px inherit;color:#1f2329}.check{accent-color:#3370ff;width:16px;height:16px}.switch{display:flex;gap:8px;align-items:center;font-size:13px}.actions{display:flex;gap:10px;align-items:center;margin-top:14px}.btn{border:1px solid #3370ff;background:#3370ff;color:#fff;border-radius:6px;padding:8px 12px;cursor:pointer;font:13px inherit}.btn.secondary{background:#fff;color:#3370ff}.btn:disabled{opacity:.6;cursor:wait}.status{margin-top:14px;padding:11px 13px;background:#f7f8fa;border-radius:7px;color:#646a73;font-size:13px}.ok{color:#1a8f3b}.warn{color:#b87300}.history{margin-top:14px}.history table{width:100%;border-collapse:collapse}.history th,.history td{padding:9px 10px;text-align:left;border-bottom:1px solid #f0f1f3;font-size:12px}.history th{color:#8f959e;font-weight:500;background:#fafbfc}@media(max-width:760px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style><script src="/loading.js"></script><script src="/app-shell.js"></script></head><body><main class="wrap"><div class="crumb"><a href="/">运营中心</a> / 日常运营 / 机器人推送</div><header class="head"><h1>飞书机器人推送配置</h1><p>运营数据保留在 Demo；这里只配置推送范围、频率和文案。保存配置不会立即发送消息。</p></header><div class="grid"><section class="panel"><h2>实时异常提醒</h2><div class="body"><div class="row"><div><b>开启实时提醒</b><small>每 10 分钟同步后，新增或重新触发的异常才会推送一次。</small></div><input id="realtime-enabled" class="check" type="checkbox"></div><label class="field">提醒标题<input id="realtime-title" maxlength="40"></label><div class="row"><span>理论负库存</span><input id="rule-negative" class="check" type="checkbox"></div><div class="row"><span>低于安全库存</span><input id="rule-safety" class="check" type="checkbox"></div><div class="row"><span>调拨异常 / 数据异常</span><input id="rule-transfer" class="check" type="checkbox"></div><label class="field">同一研判冷却时间（分钟）<input id="cooldown" type="number" min="10" max="1440" step="10"></label><button class="btn secondary" id="preview-realtime">发送提醒版式预览</button></div></section><section class="panel"><h2>运营日报</h2><div class="body"><div class="row"><div><b>每日定时发送</b><small>按中国标准时间执行；Worker 每 10 分钟检查一次。</small></div><input id="daily-enabled" class="check" type="checkbox"></div><label class="field">日报标题<input id="daily-title" maxlength="40"></label><label class="field">每日发送时间<input id="daily-time" type="time" step="600"></label><div class="row"><span>销售汇总</span><input id="include-sales" class="check" type="checkbox"></div><div class="row"><span>库存研判</span><input id="include-risks" class="check" type="checkbox"></div><div class="row"><span>调拨单据</span><input id="include-transfers" class="check" type="checkbox"></div><div class="row"><span>每日盘点计划</span><input id="include-plans" class="check" type="checkbox"></div><button class="btn secondary" id="preview-daily">发送日报版式预览</button></div></section></div><section class="panel" style="margin-top:14px"><h2>目标与发送记录</h2><div class="body"><label class="field">推送群名称（仅用于页面标识，不保存 Webhook 或密钥）<input id="group-label" maxlength="60"></label><label class="field">卡片尾注<input id="footer" maxlength="100"></label><div class="actions"><button class="btn" id="save">保存推送配置</button><span id="save-note"></span></div><div id="status" class="status">正在读取配置…</div><div class="history"><table><thead><tr><th>时间</th><th>类型</th><th>标题</th><th>状态</th></tr></thead><tbody id="history"></tbody></table></div></div></section></main><script src="/notifications-page.js"></script></body></html>
