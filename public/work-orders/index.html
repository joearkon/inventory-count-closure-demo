<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跟进工单 · 库存研判</title><script src="/loading.js"></script><script src="/app-shell.js"></script><style>
  .work-orders-page{display:grid;gap:14px}.work-order-card{overflow:hidden}.wo-head{display:flex;align-items:center;justify-content:space-between}.wo-head-actions{display:flex;gap:8px}.wo-add{background:var(--hq-navy)!important;color:#fff!important}.wo-tabs{display:flex;gap:28px;padding:0 20px;border-bottom:1px solid var(--hq-line)}.wo-tabs button{padding:13px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:#64748b}.wo-tabs button.active{border-bottom-color:var(--hq-orange);color:var(--hq-text);font-weight:700}.wo-count{display:inline-grid;place-items:center;min-width:19px;height:19px;margin-left:5px;padding:0 5px;border-radius:10px;background:#f1f5f9;font-size:10px}.wo-tabs button.active .wo-count{background:#fff0dc;color:#b85e10}.wo-toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--hq-line)}.wo-search{width:280px}.wo-toolbar input,.wo-toolbar select{height:34px;padding:0 10px;border:1px solid #d9e2ec;background:#fff}.wo-toolbar select{min-width:128px}.wo-more{color:#64748b;font-size:12px}.wo-table{width:100%}.wo-table th,.wo-table td{white-space:nowrap}.wo-table td.reason{min-width:250px;white-space:normal}.wo-table td.reason b,.wo-table td.reason small,.wo-table td.store b,.wo-table td.store small,.wo-table td.material b,.wo-table td.material small{display:block}.wo-table td small{margin-top:2px;color:#8da0b5}.rule-badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700}.rule-d2{background:#fee2e2;color:#b91c1c}.rule-d1{background:#ffedd5;color:#b45309}.rule-s1{background:#dbeafe;color:#1d4ed8}.rule-t2{background:#ede9fe;color:#6d28d9}.task-state{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}.task-state:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.task-state.store{background:#e7efff;color:#245fc2}.task-state.hq{background:#eee9ff;color:#6b4cc5}.task-state.closed{background:#dcf7e9;color:#187558}.task-state.pending{background:#fff1d8;color:#a45d00}.task-state.escalated{background:#fee2e2;color:#b91c1c}.wo-footer{display:flex;justify-content:space-between;padding:14px 20px;color:#71839a;font-size:12px}.wo-pages{display:flex;gap:5px}.wo-pages button{width:30px;height:28px;border:1px solid #d7e0e9;border-radius:5px;background:#fff}.wo-pages button.active{background:var(--hq-navy);color:#fff}@media(max-width:900px){.wo-toolbar{align-items:stretch;flex-direction:column}.wo-search,.wo-toolbar select{width:100%}.work-order-card{overflow:auto}.wo-table{min-width:1120px}}
</style></head><body><main class="container work-orders-page"><section class="section work-order-card"><div class="section-header wo-head"><div class="section-title">跟进工单</div><div class="wo-head-actions"><button class="btn" type="button">⇩ 导出</button><a class="btn wo-add" href="/task-create/">＋ 新建工单</a></div></div><nav class="wo-tabs" id="wo-tabs"></nav><div class="wo-toolbar"><input class="wo-search" id="wo-search" placeholder="⌕  搜索工单号、门店、物料…"><select id="wo-rule"><option value="all">全部规则</option><option value="D2">D2</option><option value="D1">D1</option><option value="S1">S1</option><option value="T2">T2</option></select><select id="wo-priority"><option value="all">全部优先级</option><option value="high">高</option><option value="mid">中</option><option value="low">低</option></select><span class="wo-more">▽ 更多筛选</span></div><div id="wo-table"></div></section></main><script src="/work-orders-page.js"></script></body></html>
