<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运营总览 · 库存研判</title><script src="/loading.js"></script><script src="/app-shell.js"></script>
  <style>
    .overview{display:grid;gap:16px}.overview-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.overview-kpi{padding:18px;border:1px solid var(--hq-line);border-radius:8px;background:#fff}.overview-kpi span{display:block;color:var(--hq-muted);font-size:12px}.overview-kpi b{display:block;margin-top:7px;font-size:27px}.overview-kpi small{display:block;margin-top:3px;color:#94a3b8}.overview-kpi.orange b{color:var(--hq-orange)}.overview-kpi.red b{color:var(--hq-red)}.overview-kpi.green b{color:var(--hq-green)}.overview-kpi.purple b{color:var(--hq-purple)}.overview-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.overview-grid.lower{grid-template-columns:1.15fr .85fr .8fr}.chart-card{min-height:330px}.range-switch{display:flex;padding:3px;border-radius:5px;background:#f8fafc}.range-switch b,.range-switch span{padding:4px 10px;font-size:11px}.range-switch b{border-radius:4px;background:#fff;box-shadow:0 1px 3px rgba(15,41,69,.08)}.bars{display:flex;align-items:flex-end;justify-content:space-around;height:245px;padding:30px 25px 25px;border-bottom:1px solid #dce5ee;background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,#eef2f7 40px)}.bar-day{display:grid;grid-template-columns:18px 18px;align-items:end;gap:5px;height:100%;position:relative}.bar{border-radius:4px 4px 0 0}.bar.orange{background:var(--hq-orange)}.bar.green{background:var(--hq-green)}.bar-day label{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);color:#8292a7;font-size:11px}.donut-layout{display:flex;align-items:center;justify-content:center;gap:40px;padding:42px 20px}.donut{width:166px;height:166px;border-radius:50%;background:conic-gradient(var(--hq-red) 0 28%,var(--hq-orange) 28% 49%,#2f648e 49% 87%,var(--hq-purple) 87%);position:relative}.donut:after{content:"";position:absolute;inset:23px;border-radius:50%;background:#fff}.legend{display:grid;gap:11px}.legend span{display:flex;align-items:center;gap:8px;color:#52657a;font-size:12px}.legend i{width:24px;height:13px;border-radius:3px}.risk-list,.confirm-list,.quality-list{padding:8px 20px 16px}.risk-row{padding:12px 0;border-bottom:1px solid #edf1f5}.risk-row:last-child{border:0}.risk-row b{font-size:13px}.risk-row p{margin:4px 0 0;color:#71839a;font-size:12px}.rule-pill{display:inline-block;margin-right:7px;padding:2px 7px;border-radius:3px;font-size:11px}.rule-d2{background:#fee2e2;color:#b91c1c}.rule-d1{background:#ffedd5;color:#b45309}.rule-s1{background:#dbeafe;color:#1d4ed8}.rule-t2{background:#ede9fe;color:#6d28d9}.confirm-row{padding:13px;border-radius:6px;background:#f8fafc}.confirm-row+ .confirm-row{margin-top:8px}.confirm-row b,.confirm-row small{display:block}.confirm-row small{margin-top:4px;color:#7b8da2}.quality-list{display:grid;gap:18px}.quality-list div{display:flex;justify-content:space-between}.quality-list span{color:#65788e}.overview-empty{padding:40px;text-align:center;color:#94a3b8}@media(max-width:1100px){.overview-kpis{grid-template-columns:repeat(2,1fr)}.overview-grid,.overview-grid.lower{grid-template-columns:1fr}}@media(max-width:650px){.overview-kpis{grid-template-columns:1fr}.donut-layout{flex-direction:column}.bars{padding-left:5px;padding-right:5px}}
  </style>
</head>
<body><main class="container overview">
  <section class="overview-kpis" id="overview-kpis"></section>
  <section class="overview-grid"><article class="section chart-card"><div class="section-header"><div class="section-title">异常与闭环趋势（近 7 日）</div><div class="range-switch"><b>日</b><span>周</span><span>月</span></div></div><div id="trend-chart"></div></article><article class="section chart-card"><div class="section-header"><div class="section-title">异常类型分布</div></div><div class="donut-layout"><div class="donut" aria-label="异常类型分布图"></div><div class="legend"><span><i style="background:var(--hq-red)"></i>D2 负库存</span><span><i style="background:var(--hq-orange)"></i>D1 账实差异</span><span><i style="background:#2f648e"></i>S1 补货风险</span><span><i style="background:var(--hq-purple)"></i>T2 供耗失衡</span></div></div></article></section>
  <section class="overview-grid lower"><article class="section"><div class="section-header"><div class="section-title">当前重点异常</div><a class="btn" href="/diagnosis-v3/">查看全部</a></div><div class="risk-list" id="risk-list"></div></article><article class="section"><div class="section-header"><div class="section-title">待总部确认</div><a class="btn" href="/work-orders/">查看工单</a></div><div class="confirm-list" id="confirm-list"></div></article><article class="section"><div class="section-header"><div class="section-title">闭环质量指标</div></div><div class="quality-list" id="quality-list"></div></article></section>
</main><script src="/hq-overview-page.js"></script></body></html>
