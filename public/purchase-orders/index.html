<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订货管理 · 小笼包门店运营</title><link rel="stylesheet" href="/procurement.css"><script src="/loading.js"></script><script src="/app-shell.js"></script></head><body data-procurement-mode="purchase"><main class="wrap"><div class="crumb"><a href="/">运营中心</a> / 日常运营 / 订货管理</div><header class="head"><div><h1>订货管理</h1><p>订货单先保存草稿，人工确认提交后等待收货；订货本身不改变库存。</p></div></header><nav class="tabs"><button class="tab active" data-tab="list">订货单列表</button><button class="tab" data-tab="create">新建订货草稿</button></nav><section class="panel" data-panel="list"><div class="filters"><label>门店<select id="store-filter"><option value="">全部门店</option></select></label><label>状态<select id="status-filter"><option value="">全部状态</option><option value="draft">草稿</option><option value="pending_receipt">待收货</option><option value="partially_received">部分收货</option><option value="received">已收货</option><option value="cancelled">已取消</option></select></label></div><div class="table-wrap"><table><thead><tr><th>订货单号</th><th>日期</th><th>门店</th><th>供应商</th><th>物料</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pager" class="list-pager"></div></section><section class="panel" data-panel="create" hidden><div class="panel-head"><h2>新建订货草稿</h2><span>可由工单预填紧急补货</span></div><form id="create-form"><div class="form-grid"><label>门店<select id="store" required></select></label><label>订货日期<input id="date" type="date" required></label><label>预计到货<input id="expected-date" type="date"></label><label>供应商<input id="supplier" placeholder="待确认供应商"></label><label>紧急程度<select id="urgency"><option value="normal">普通</option><option value="urgent">紧急</option><option value="critical">最高</option></select></label><label>来源类型<select id="source-type"><option value="manual">人工新建</option><option value="work_order">跟进工单</option><option value="restock_request">补货申请</option><option value="ai_suggestion">AI 建议</option></select></label><label class="wide">来源工单<input id="work-order" placeholder="可选，例如 OPT-..."></label><label class="wide">备注<textarea id="note" rows="2"></textarea></label></div><div class="lines"><b>物料明细</b><div id="line-rows"></div><button type="button" class="btn secondary" id="add-line">+ 增加物料</button></div><div class="actions"><button class="btn" type="submit">保存订货草稿</button></div></form><div id="toast" class="toast"></div></section></main><script src="/procurement-page.js"></script></body></html>
