<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · 小笼包门店运营</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eef4ff,#f7f8fa 52%,#eef8f1);color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(960px,calc(100% - 28px));display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px rgba(25,55,100,.14)}.intro{padding:48px;background:#2468e8;color:#fff}.brand{font-size:16px;font-weight:700}.intro h1{margin:68px 0 12px;font-size:34px;line-height:1.25}.intro p{color:rgba(255,255,255,.8);font-size:15px}.flow{margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.2)}.flow span{display:block;margin:8px 0}.login{padding:42px}.login h2{margin:0;font-size:24px}.sub{color:#646a73;margin:7px 0 22px}.accounts{display:grid;gap:8px;margin-bottom:14px}.account{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:11px;border:1px solid #e2e5e9;border-radius:9px;background:#fff;text-align:left;cursor:pointer}.account:hover,.account.selected{border-color:#3370ff;background:#f4f7ff}.account:disabled{cursor:wait;opacity:.65}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e8f0ff;color:#2468e8;font-weight:700}.account-copy{min-width:0;flex:1}.account b{display:block}.account small{display:block;color:#8f959e}.enter-arrow{color:#3370ff;font-size:12px;font-weight:700}.enter-state{position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;background:rgba(244,247,255,.94);color:#2468e8;font-weight:700}.hint{padding:10px 11px;border-radius:8px;background:#f2f6ff;color:#49658f;font-size:12px}.message{min-height:21px;margin-top:8px;color:#d4380d;font-size:12px}

  body{display:block;min-height:100dvh;background:#f3f6fb;overscroll-behavior-y:none}

</style></head><body data-portal="mobile"><main class="shell"><section class="intro"><div class="brand">◈ 小笼包门店经营</div><h1>今天先做好最重要的事</h1><p>门店店员、加盟商和区域督导使用同一套移动工作台，按身份查看各自门店范围和可执行事项。</p><div class="flow"><span>门店店员 → 执行任务与记录凭证</span><span>加盟商 → 确认单据与经营动作</span><span>区域督导 → 查看辖区门店并协助处理</span></div></section><section class="login"><h2>选择人物进入</h2><p class="sub">这是演示环境，点击人物即可进入对应的移动工作台。</p><div class="accounts" id="accounts">正在读取人物…</div><div class="hint">系统仍会按人物身份限制可见门店、区域和操作权限。</div><div class="message" id="message"></div><p style="margin:14px 0 0;text-align:center;font-size:12px"><a href="/hq-login/" style="color:#2468e8">总部人员入口</a></p></section></main><script src="/login-page.js"></script></body></html>
