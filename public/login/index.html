<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小笼包门店运营</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eef4ff,#f7f8fa 52%,#eef8f1);color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(960px,calc(100% - 28px));display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px rgba(25,55,100,.14)}.intro{padding:48px;background:#2468e8;color:#fff}.brand{font-size:16px;font-weight:700}.intro h1{margin:68px 0 12px;font-size:34px;line-height:1.25}.intro p{color:rgba(255,255,255,.8);font-size:15px}.flow{margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.2)}.flow span{display:block;margin:8px 0}.login{padding:42px}.login h2{margin:0;font-size:24px}.sub{color:#646a73;margin:7px 0 22px}.accounts{display:grid;gap:8px;margin-bottom:18px}.account{display:flex;align-items:center;gap:11px;width:100%;padding:11px;border:1px solid #e2e5e9;border-radius:9px;background:#fff;text-align:left;cursor:pointer}.account:hover,.account.selected{border-color:#3370ff;background:#f4f7ff}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e8f0ff;color:#2468e8;font-weight:700}.account b{display:block}.account small{color:#8f959e}.field{display:block;margin:11px 0;color:#646a73;font-size:12px}.field input{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid #dcdfe5;border-radius:7px;font:14px inherit}.hint{padding:9px 11px;border-radius:7px;background:#fff7e6;color:#874d00;font-size:12px}.btn{width:100%;margin-top:15px;padding:11px;border:0;border-radius:7px;background:#3370ff;color:#fff;font:600 14px inherit;cursor:pointer}.btn:disabled{opacity:.6}.message{min-height:21px;margin-top:8px;color:#d4380d;font-size:12px}@media(max-width:720px){.shell{grid-template-columns:1fr}.intro{padding:24px}.intro h1{margin:24px 0 8px;font-size:26px}.flow{display:none}.login{padding:24px}}
</style></head><body data-portal="mobile"><main class="shell"><section class="intro"><div class="brand">◈ 小笼包门店经营</div><h1>今天先做好最重要的事</h1><p>门店店员、加盟商和区域督导使用同一套移动工作台，按身份查看各自门店范围和可执行事项。</p><div class="flow"><span>门店店员 → 执行任务与记录凭证</span><span>加盟商 → 确认单据与经营动作</span><span>区域督导 → 查看辖区门店并协助处理</span></div></section><section class="login"><h2>移动端登录</h2><p class="sub">请选择门店店员、加盟商或区域督导身份。</p><div class="accounts" id="accounts">正在读取账号…</div><form id="form"><label class="field">账号邮箱<input id="email" type="email" required autocomplete="username"></label><label class="field">密码<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><div class="hint">这是 Demo 独立密码登录。系统仅保存加盐哈希，不保存明文密码。</div><button class="btn" id="submit">登录移动工作台</button><div class="message" id="message"></div></form><p style="margin:14px 0 0;text-align:center;font-size:12px"><a href="/hq-login/" style="color:#2468e8">总部人员登录后台</a></p></section></main><script src="/login-page.js"></script></body></html>
