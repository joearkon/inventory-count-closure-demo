</style><script src="/loading.js"></script><script src="/app-shell.js"></script></head><body><main class="wrap"><div class="crumb"><a href="/">运营中心</a> / 系统配置 / 账户与角色</div><header class="head"><div><h1>账户与角色</h1><p>配置演示账号、岗位角色和可管理的组织范围，用于打通门店—督导—总部的责任流转。</p></div><button class="btn" id="create">新建账号</button></header><div class="notice"><b>当前为身份与权限预演。</b> 切换身份会更新后台展示与操作审计，但尚不会拦截已有业务 API；正式 OAuth、会话和服务端权限校验将在下一阶段启用。</div><section class="summary"><div class="metric"><b id="count-all">—</b><span>账号总数</span></div><div class="metric"><b id="count-active">—</b><span>启用账号</span></div><div class="metric"><b id="count-role">—</b><span>岗位角色</span></div><div class="metric"><b id="count-scope">—</b><span>已覆盖门店</span></div></section><div class="layout"><section class="panel"><div class="panel-head"><h2>账号与组织范围</h2><span class="muted">角色决定能做什么，范围决定能看哪些组织</span></div><div class="current-box" id="current">正在读取当前身份…</div><div class="table-wrap"><table><thead><tr><th>人员</th><th>登录方式</th><th>角色</th><th>组织范围</th><th>状态</th><th>操作</th></tr></thead><tbody id="accounts"><tr><td colspan="6" class="empty">正在读取…</td></tr></tbody></table></div><div id="pager"></div></section><aside><section class="panel"><div class="panel-head"><h2 id="form-title">新建账号</h2><button class="btn secondary small" id="clear">清空</button></div><form class="panel-body" id="form"><input type="hidden" id="account-id"><div class="form-grid"><label class="field">姓名<input id="display-name" maxlength="80" required placeholder="例如：门店店长"></label><label class="field">邮箱<input id="email" type="email" maxlength="160" required placeholder="name@example.com"></label><label class="field full">登录身份<select id="provider"><option value="email_demo">门店邮箱（演示）</option><option value="feishu_demo">飞书账号（演示）</option><option value="oauth_demo">品牌 OAuth（演示）</option></select></label><div class="field full">岗位角色<div class="checks" id="role-checks"></div></div><label class="field full">数据范围<select id="scope"><option value="stores">指定门店</option><opt
