<!doctype html>
<html lang="zh-CN">
<head>

  <title>库存研判 · 门店库存运营</title>
  <script src="/app-shell.js"></script>
  <style>

en;background:#fff;margin:0 0 14px}.review-section header{padding:14px 17px;background:#fbfcff;border-bottom:1px solid #e8ebf0}.review-section h2{font-size:17px;margin:0}.review-section header p{margin:2px 0 0;font-size:13px;color:#646a73}.review-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 17px;border-bottom:1px solid #eef0f3}.review-row:last-child{border-bottom:0}.review-row b{display:block}.review-row p{margin:3px 0 0;font-size:14px;color:#4e5969}.review-row small{display:block;margin-top:3px;color:#8f959e;font-size:12px}.review-value{text-align:right;white-space:nowrap}.signal-note{margin-top:8px;padding:9px 10px;border-left:3px solid #3370ff;background:#f5f8ff;border-radius:0 7px 7px 0;color:#41464d;font-size:14px}.group{border:1px solid #e5e6eb;border-radius:12px;overflow:hidden;background:#fff;margin:0 0 14px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;background:#fbfcff;border-bottom:1px solid #e8ebf0}.group-head h2{font-size:17px;margin:0}.group-head p{margin:1px 0 0;font-size:13px;color:#646a73}.count{font-size:13px;white-space:nowrap;color:#2468e8;background:#eaf2ff;border-radius:12px;padding:3px 9px}.issue{padding:16px 17px;border-bottom:1px solid #eef0f3}.issue:last-child{border-bottom:0}.issue-head{display:flex;gap:12px;justify-content:space-between}.issue-title{display:flex;gap:8px;align-items:center;min-width:0}.rule{font-size:12px;font-weight:700;white-space:nowrap;border-radius:5px;padding:2px 6px;background:#fff1f0;color:#d4380d}.rule.mid{background:#fff7e6;color:#d46b08}.rule.low{background:#edf4ff;color:#2468e8}.issue h3{font-size:17px;margin:0;overflow-wrap:anywhere}.subline{margin:2px 0 0;color:#646a73;font-size:13px}.status{font-size:13px;white-space:nowrap;padding:3px 8px;border-radius:12px;background:#f2f3f5;color:#646a73;height:min-content}.status.done{background:#e8f7ed;color:#237b45}.status.no-issue{background:#f2f3f5;color:#646a73}.finding{margin-top:12px;border-left:4px solid #3370ff;background:#f5f8ff;padding:11px 12px;border-radius:0 8px 8px 0}.finding .label{font-size:13px;color:#2468e8;font-weight:700}.finding b{display:block;margin:2px 0}.finding p{margin:0;color:#41464d;font-size:14px}.evidence{margin-top:12px}.evidence h4,.next h4{font-size:14px;margin:0 0 5px}.evidence ul{margin:0;padding-left:19px;color:#4e5969;font-size:14px}.evidence li{margin:3px 0}.next{margin-top:12px}.next p{margin:0;color:#4e5969;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.button{border:1px solid #3370ff;border-radius:7px;background:#3370ff;color:#fff;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}.button.secondary{background:#fff;color:#2468e8}.button.ghost{background:#fff;border-color:#dcdfe6;color:#4e5969}.button:disabled{opacity:.55;cursor:wait}.meta{font-size:12px;color:#8f959e;margin-top:11px}.empty,.error{padding:44px 20px;text-align:center;background:#fff;border:1px solid #e5e6eb;border-radius:10px;color:#646a73}.error{color:#cf1322;border-color:#ffccc7;background:#fff2f0}.shadow-panel{margin:0 0 16px;border:1px solid #91b2ff;border-radius:12px;background:#fff;overflow:hidden}.shadow-head{display:flex;justify-content:space-between;gap:16px;padding:14px 17px;background:#edf4ff}.shadow-head h2{margin:0;font-size:18px}.shadow-head p{margin:2px 0 0;color:#4e5969;font-size:13px}.shadow-banner{padding:9px 17px;background:#fff7e6;color:#8a4b08;font-size:13px;border-bottom:1px solid #f7dfae}.shadow-card{padding:16px 17px;border-bottom:1px solid #eef0f3}.shadow-card:last-child{border-bottom:0}.shadow-card h3{margin:0 0 10px;font-size:17px}.shadow-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shadow-side{border:1px solid #e5e6eb;border-radius:9px;padding:12px;background:#fbfcff}.shadow-side.v2{border-color:#b7caff;background:#f5f8ff}.shadow-side h4{margin:0 0 7px}.shadow-side p{margin:5px 0;font-size:14px}.trace{margin:10px 0 0;padding-left:19px;font-size:13px;color:#4e5969}.action-chip{display:inline-block;margin:5px 5px 0 0;padding:3px 8px;border-radius:12px;background:#eaf2ff;color:#2468e8;font-size:12px}.close-shadow{border:0;background:transparent;color:#2468e8;cursor:pointer;font:inherit}@media(max-width:720px){.wrap{padding:20px 14px}.head-row{display:block}.preview-trigger{margin-top:12px}.controls{grid-template-columns:1fr}.summary,.review-summary{grid-template-columns:repeat(2,1fr)}.review-tabs{overflow:auto}.review-tab{white-space:nowrap}.issue-head{display:block}.status{display:inline-block;margin-top:8px}.group-head{padding:13px 14px}.issue,.review-row{padding:14px}.view-tab{flex:1;text-align:center}.review-row{display:block}.review-value{text-align:left;margin-top:8px}.shadow-grid{grid-template-columns:1fr}}
    .rule-note{font-size:12px;color:#2468e8;background:#edf4ff;border-radius:10px;padding:2px 7px;cursor:help;white-space:nowrap}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="crumb"><a href="/">运营中心</a> / 库存研判</div>
    <header class="head"><div class="head-row"><div><h1>库存研判</h1><p>按门店或物料查看需要优先处理的库存问题。</p></div><button class="preview-trigger" id="v2-preview-toggle">规则 V2 对照·预览</button></div></header>
    <style>.evidence-gaps{margin:10px 0;padding:10px;background:#fff;border:1px solid #d9e3ff;border-radius:8px}.evidence-gaps>b{font-size:13px}.evidence-gap{display:grid;grid-template-columns:auto auto;justify-content:start;gap:6px 8px;margin-top:8px}.evidence-gap span{font-weight:650}.evidence-gap em{font-style:normal;font-size:12px;color:#8a4b08;background:#fff3dc;border-radius:10px;padding:2px 7px}.evidence-gap small{grid-column:1/-1;color:#646a73}.evidence-complete{color:#237b45;background:#e8f7ed;padding:8px;border-radius:7px}</style>
    <section class="shadow-panel" id="v2-shadow-panel" hidden aria-live="polite"></section>
    <nav class="view-tabs" aria-label="查看方式"><button class="view-tab active" data-view="store">按门店</button><button class="view-tab" data-view="material">按物料</button></nav>
    <section class="controls" aria-label="研判筛选">
      <div class="control"><label for="store-filter">门店</label><select id="store-filter"><option value="all">全部门店</option></select></div>
      <div class="control"><label for="rule-filter">异常类型</label><select id="rule-filter"><option value="all">全部类型</option><option value="NEGATIVE_THEORETICAL">D2 · 负库存</option><option value="COUNT_VARIANCE">D1 · 理论与实盘差异</option><option value="BELOW_SAFETY_STOCK">S1 · 安全库存</option><option value="SELL_IN_IMBALANCE">T2 · 销入比</option></select></div>
      <div class="control"><label for="attribution-filter">首要归因</label><select id="attribution-filter"><option value="all">全部归因</option><option value="receipt_transfer">收货／调拨</option><option value="count_loss">盘点／报损</option><option value="restock">门店补货</option><option value="master_data">商品／主数据</option></select></div>
    </section>
    <section class="summary" id="summary" aria-label="研判摘要"></section>
    <section id="diagnosis-list" aria-live="polite"><div class="empty">正在读取库存研判…</div></section><div id="diagnosis-pager" class="list-pager"></div>
  </main>
  <script src="/diagnosis-page.js"></script>
</body>
</html>
