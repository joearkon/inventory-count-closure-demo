<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>库存模拟器 · 加盟商库存运营闭环</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 22px 48px}.product-nav{display:flex;gap:6px;align-items:center;margin:0 0 10px;padding:7px;border:1px solid #e5e9f2;border-radius:9px;background:#fff}.product-nav a{padding:7px 11px;border-radius:6px;color:#646a73;text-decoration:none;font-size:13px}.product-nav a:hover{background:#f5f8ff;color:#3370ff}.product-nav .active{background:#e8f0ff;color:#2468e8;font-weight:600}.page-path{margin:0 0 10px;color:#8f959e;font-size:13px}.page-path a{color:#3370ff;text-decoration:none}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.head h1{margin:0;font-size:24px}.head p,.note{color:#646a73}.head p{margin:5px 0 0}.tag{padding:4px 8px;border-radius:5px;background:#e8f4ff;color:#1d6fdc;font-size:12px;text-decoration:none}.panel{overflow:hidden;margin-top:14px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid #f0f1f3}.panel-head h2{margin:0;font-size:16px}.panel-head span{font-size:12px;color:#8f959e}.form{display:grid;grid-template-columns:1fr 1.2fr 1fr .7fr 1.2fr auto;gap:10px;padding:18px}.form label{color:#646a73;font-size:12px}.form input,.form select{display:block;width:100%;margin-top:5px;padding:8px 9px;border:1px solid #dcdfe5;border-radius:6px;background:#fff;font:14px inherit}.btn{border:1px solid #dcdfe5;background:#fff;border-radius:6px;padding:8px 12px;font:13px inherit;cursor:pointer}.primary{background:#3370ff;color:#fff;border-color:#3370ff}.note{padding:0 18px 15px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#edf1f7}.metric{padding:14px 18px;background:#fff}.metric span{display:block;color:#8f959e;font-size:12px}.metric b{display:block;margin-top:3px;font-size:21px}.bad,.out{color:#d72a2a}.in{color:#2a9d3f}.toast{display:none;margin:0 18px 14px;padding:9px 11px;border-radius:6px;background:#e0f5e8;color:#25783c;font-size:13px}.toast.error{background:#ffe7e7;color:#b42323}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 18px;text-align:left;border-bottom:1px solid #f0f1f3}th{background:#fafbfc;color:#8f959e;font-size:12px;font-weight:500}.empty{padding:26px;text-align:center;color:#8f959e}@media(max-width:760px){.wrap{padding:16px}.product-nav{overflow:auto}.product-nav a{white-space:nowrap}.head{display:block}.form{grid-template-columns:1fr 1fr}.form label:nth-child(2),.form label:nth-child(5),.form button{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}}
  </style>
  <script src="/loading.js"></script>
  <script src="/app-shell.js"></script>
</head>
<body>
  <main class="wrap">
    <nav class="product-nav" aria-label="库存数据导航"><a href="/">运营任务</a><a href="/ledger/">库存台账</a><a class="active" href="/simulator/">库存模拟器</a><a href="/sync/">飞书同步</a></nav>
    <div class="page-path"><a href="/">运营任务中心</a> / <a href="/ledger/">库存数据</a> / 库存模拟器</div>
    <header class="head"><div><h1>库存动作模拟器</h1><p>创建可撤销的收货、报损、调拨事件，实时回算所选门店与物料，不回写飞书原始表。</p></div><a class="tag" href="/ledger/">查看完整台账 →</a></header>
    <section class="panel"><div class="panel-head"><h2>新增模拟库存动作</h2><span>写入 R2 演示状态</span></div><form class="form" id="event-form"><label>门店<select id="store" required></select></label><label>物料<select id="material" required></select></label><label>动作<select id="type"><option value="receipt">收货入库</option><option value="scrap">报损出库</option><option value="transfer_in">调拨入库</option><option value="transfer_out">调拨出库</option></select></label><label>数量<input id="qty" type="number" min="0.001" step="0.001" placeholder="例如 2" required></label><label>备注 / 外部单号<input id="reference" maxlength="80" placeholder="可选"></label><button class="btn primary" type="submit">写入并回算</button></form><div class="toast" id="toast"></div><p class="note">调拨入 / 出以当前门店为准；未来接入多门店调拨表后，会以相同调拨单号自动生成两家门店的对应流水。</p></section>
    <section class="panel"><div class="metrics"><div class="metric"><span>当前门店</span><b id="store-kpi">--</b></div><div class="metric"><span>选中物料理论期末</span><b id="material-kpi">--</b></div><div class="metric"><span>有效模拟流水</span><b id="event-kpi">--</b></div></div></section>
    <section class="panel"><div class="panel-head"><h2>当前门店模拟流水</h2><span>撤销后立即恢复理论库存</span></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>动作 / 单据号</th><th>物料</th><th>数量</th><th>备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="simulator-pager" class="list-pager"></div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:3});
    const labels={receipt:'收货入库',scrap:'报损出库',transfer_in:'调拨入库',transfer_out:'调拨出库'};
    let state, view, currentPage=1;
    async function api(path, options={}) { const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options}); const d=await r.json(); if(!r.ok) throw Error(d.error||'操作失败'); return d; }
    function note(text,error=false){const n=$('toast');n.textContent=text;n.className=`toast${error?' error':''}`;n.style.display='block';setTimeout(()=>n.style.display='none',3200)}
    function current(){return (view?.ledger||[]).find(x=>x.material_name===$('material').value)}
    function render(){const stores=state.storeViews||[], store=$('store'); if(!store.options.length) store.innerHTML=stores.map(x=>`<option value="${x.store_code}">${x.store_code}</option>`).join(''); view=stores.find(x=>x.store_code===store.value)||stores[0];if(!view)return;const material=$('material'),before=material.value;material.innerHTML=(view.ledger||[]).map(x=>`<option value="${x.material_name}" data-unit="${x.unit}">${x.material_name}（${x.unit}）</option>`).join('');if([...material.options].some(x=>x.value===before))material.value=before;const row=current(),events=(view.ledger||[]).flatMap(x=>(x.manual_events||[]).map(e=>({...e,unit:x.unit}))).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))),page=window.ListPager.slice(events,currentPage,15);currentPage=page.page;$('store-kpi').textContent=view.store_code;$('material-kpi').textContent=row?`${fmt(row.theoretical_closing_qty)} ${row.unit}`:'--';$('material-kpi').className=row?.theoretical_closing_qty<0?'bad':'';$('event-kpi').textContent=`${events.length} 笔`;$('rows').innerHTML=page.items.length?page.items.map(e=>`<tr><td>${new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</td><td><b>${labels[e.type]}</b><br><small>${e.document_no}</small></td><td>${e.material_name}</td><td class="${['receipt','transfer_in'].includes(e.type)?'in':'out'}">${['receipt','transfer_in'].includes(e.type)?'+':'−'} ${fmt(e.qty)} ${e.unit}</td><td>${e.reference||'—'}</td><td><button class="btn" data-revert="${e.id}">撤销</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">尚未写入模拟库存动作。</td></tr>';window.ListPager.render('simulator-pager',page,next=>{currentPage=next;render()});document.querySelectorAll('[data-revert]').forEach(b=>b.onclick=async()=>{if(!confirm('撤销这笔模拟动作？'))return;try{await api(`/api/material-events/${b.dataset.revert}/revert`,{method:'POST'});await load();note('已撤销并完成回算。')}catch(e){note(e.message,true)}})}
    async function load(){state=await (await fetch('/api/feishu-sync/state?view=simulator',{cache:'no-store'})).json();render()}
    $('store').onchange=()=>{currentPage=1;render()};$('material').onchange=render;$('event-form').onsubmit=async e=>{e.preventDefault();const opt=$('material').selectedOptions[0],button=e.currentTarget.querySelector('button');button.disabled=true;try{await api('/api/material-events',{method:'POST',body:JSON.stringify({store_code:$('store').value,material_name:$('material').value,unit:opt.dataset.unit,type:$('type').value,qty:Number($('qty').value),reference:$('reference').value})});$('qty').value='';$('reference').value='';currentPage=1;await load();note('库存动作已写入，理论库存和研判已回算。')}catch(err){note(err.message,true)}finally{button.disabled=false}};load().catch(e=>note(e.message,true));
  </script>
</body>
</html>
