<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调拨管理 · 小笼包门店运营</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:26px 22px 48px}.crumb{font-size:13px;color:#8f959e}.crumb a{color:#3370ff;text-decoration:none}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:8px 0 18px}.head h1{margin:0;font-size:24px}.head p{margin:5px 0 0;color:#646a73}.view-tabs{display:flex;gap:6px;padding:5px;background:#fff;border:1px solid #e5e6eb;border-radius:10px}.view-tab{border:0;background:transparent;color:#4e5969;border-radius:7px;padding:9px 16px;font:600 14px inherit;cursor:pointer}.view-tab.active{background:#3370ff;color:#fff}.source-tabs{display:flex;gap:8px;margin-top:14px}.source-tab{border:1px solid #dcdfe5;background:#fff;color:#4e5969;border-radius:18px;padding:7px 13px;font:13px inherit;cursor:pointer}.source-tab.active{border-color:#3370ff;background:#edf4ff;color:#245bdb}.panel{margin-top:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid #f0f1f3}.panel-head h2{margin:0;font-size:16px}.panel-head span{color:#8f959e;font-size:12px}.note{padding:12px 17px;background:#f5f8ff;color:#4e5969;font-size:13px}.form{display:grid;grid-template-columns:1fr 1.2fr 1fr 1fr;gap:11px;padding:17px}.form label{color:#646a73;font-size:12px}.form input,.form select{display:block;width:100%;margin-top:5px;border:1px solid #dcdfe5;border-radius:6px;padding:8px 9px;font:14px inherit;background:#fff}.targets{padding:0 17px 17px}.target{display:grid;grid-template-columns:1fr .65fr auto;gap:10px;margin:8px 0}.btn{border:1px solid #3370ff;background:#3370ff;color:#fff;border-radius:6px;padding:8px 12px;cursor:pointer;font:13px inherit}.btn.secondary{background:#fff;color:#3370ff}.btn.small{padding:5px 8px;font-size:12px}.btn:disabled{opacity:.6;cursor:wait}.actions{display:flex;gap:10px;padding:0 17px 17px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #f0f1f3;vertical-align:top}th{background:#fafbfc;color:#8f959e;font-size:12px;font-weight:500}.tag{display:inline-block;padding:3px 7px;border-radius:4px;background:#e8f4ff;color:#1d6fdc;font-size:12px}.tag.demo{background:#fff4df;color:#b87300}.empty{padding:28px;text-align:center;color:#8f959e}.toast{display:none;margin:0 17px 14px;padding:9px 11px;border-radius:6px;background:#e0f5e8;color:#25783c}.toast.error{background:#ffe7e7;color:#b42323}@media(max-width:760px){.wrap{padding:16px}.head{display:block}.form{grid-template-columns:1fr 1fr}.form label:nth-child(2),.form label:nth-child(4){grid-column:1/-1}.target{grid-template-columns:1fr .7fr auto}}
</style><script src="/loading.js"></script><script src="/app-shell.js"></script></head><body><main class="wrap"><div class="crumb"><a href="/">运营中心</a> / 日常运营 / 调拨管理</div><header class="head"><div><h1>调拨管理</h1><p>查看调拨单或创建调拨；库存增减明细统一到“库存流水”查询。</p></div></header><nav class="view-tabs" aria-label="调拨管理视图"><button class="view-tab active" type="button" data-transfer-tab="list">调拨单列表</button><button class="view-tab" type="button" data-transfer-tab="create">创建调拨单</button></nav><section class="panel" data-transfer-panel="create" hidden><div class="panel-head"><h2>创建调拨单</h2><span>不回写飞书 · 创建后等待调入门店确认</span></div><div class="note">总部仓 / 前置仓调出只登记门店调入；门店调出会校验调出后仍不低于安全库存。</div><form id="form"><div class="form"><label>调出方类型<select id="from-type"><option value="hq_warehouse">总部仓</option><option value="franchise_hub">加盟商前置仓 / 大店</option><option value="store">门店</option></select></label><label>调出方名称 / 编码<input id="from-party" required placeholder="例如：总部中央仓 / STORE001"></label><label>物料<select id="material" required></select></label><label>调拨日期<input id="date" type="date" required></label></div><div class="targets"><b style="font-size:13px">调入门店与数量</b><div id="target-rows"></div><button type="button" class="btn small secondary" id="add-target">+ 增加调入门店</button></div><div class="actions"><button class="btn" type="submit">创建调拨单并回算</button><span id="unit-note" style="color:#8f959e;font-size:13px"></span></div></form><div id="toast" class="toast"></div></section><div class="source-tabs" data-transfer-panel="list"><button class="source-tab active" type="button" data-transfer-source="demo">系统调拨单</button><button class="source-tab" type="button" data-transfer-source="feishu">飞书调拨单</button></div><section class="panel" data-transfer-panel="list" data-transfer-source-panel="feishu" hidden><div class="panel-head"><h2>飞书调拨单</h2><span id="source-status">读取中…</span></div><div id="source-note" class="note"></div><div class="table-wrap"><table><thead><tr><th>调拨单号</th><th>日期</th><th>调出方</th><th>调入方</th><th>物料</th><th>数量</th><th>状态</th></tr></thead><tbody id="feishu-rows"></tbody></table></div><div id="feishu-transfer-pager" class="list-pager"></div></section><section class="panel" data-transfer-panel="list" data-transfer-source-panel="demo"><div class="panel-head"><h2>系统调拨单</h2><span>单据状态与收货进度</span></div><div class="table-wrap"><table><thead><tr><th>调拨单号</th><th>日期</th><th>调出方</th><th>调入门店</th><th>物料 / 总量</th><th>状态</th></tr></thead><tbody id="demo-rows"></tbody></table></div><div id="demo-transfer-pager" class="list-pager"></div></section></main><script src="/transfers-page.js"></script></body></html>
