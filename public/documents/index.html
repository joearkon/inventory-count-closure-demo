<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存单据 · 小笼包门店运营</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:26px 22px 48px}.crumb{font-size:13px;color:#8f959e}.crumb a{color:#3370ff;text-decoration:none}h1{margin:8px 0 4px;font-size:24px}.sub{color:#646a73;margin:0 0 18px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px 16px;background:#fff;border-radius:10px;margin-bottom:14px}.filters label{font-size:12px;color:#646a73}.filters select{display:block;width:100%;margin-top:5px;padding:8px;border:1px solid #dcdfe5;border-radius:6px;background:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.metric,.panel{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}.metric{padding:15px}.metric b{display:block;font-size:24px}.metric span{color:#646a73}.panel{overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid #f0f1f3}.panel-head h2{margin:0;font-size:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #f0f1f3;vertical-align:top}th{background:#fafbfc;color:#8f959e;font-size:12px;font-weight:500}.tag{display:inline-block;padding:3px 7px;border-radius:4px;background:#e8f4ff;color:#1d6fdc;font-size:12px}.tag.pending{background:#fff4df;color:#b87300}.tag.cancelled{background:#f0f1f3;color:#646a73}.empty{text-align:center;color:#8f959e;padding:30px}@media(max-width:760px){.wrap{padding:16px}.filters,.cards{grid-template-columns:1fr}}
</style><script src="/loading.js"></script><script src="/app-shell.js"></script></head><body><main class="wrap"><div class="crumb"><a href="/">运营中心</a> / 日常运营 / 库存单据</div><h1>库存单据</h1><p class="sub">总部只查看门店已提交的收货、报损与调拨单据及其状态；不增加加盟商审批环节。</p><section class="filters"><label>门店<select id="store-filter"><option value="">全部门店</option></select></label><label>单据类型<select id="type-filter"><option value="">全部类型</option><option value="receipt">收货单</option><option value="scrap">报损单</option><option value="transfer">调拨单</option></select></label><label>状态<select id="status-filter"><option value="">全部状态</option><option value="completed">已生效/已完成</option><option value="pending">待收货</option><option value="cancelled">已撤销</option></select></label></section><div class="cards"><div class="metric"><b id="receipt-count">0</b><span>收货单</span></div><div class="metric"><b id="scrap-count">0</b><span>报损单</span></div><div class="metric"><b id="transfer-count">0</b><span>调拨单</span></div></div><section class="panel"><div class="panel-head"><h2>单据明细</h2></div><div class="table-wrap"><table><thead><tr><th>单据号</th><th>营业日</th><th>类型</th><th>门店/流向</th><th>物料</th><th>数量</th><th>状态</th><th>来源/备注</th></tr></thead><tbody id="document-rows"></tbody></table></div><div id="document-pager" class="list-pager"></div></section></main><script src="/documents-page.js"></script></body></html>
